services:
  proxy:
    image: ghcr.io/adaofeliz/slack-mcp-oauth-proxy:latest
    ports:
      - '3000:3000'
    volumes:
      - proxy-data:/app/data
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  proxy-data:
